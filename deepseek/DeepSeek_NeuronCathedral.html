<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEURON CATHEDRAL • CONSCIOUSNODE SOFTWORKS</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0c0e;
      background-image: radial-gradient(circle at 20% 30%, #1a1f2a 0%, #030405 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* CRT overlay effect */
    .crt::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: rgba(18, 16, 16, 0.1);
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Draggable window */
    .window {
      position: absolute;
      background: rgba(10, 15, 20, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #00f7ff;
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.2), inset 0 0 10px rgba(0, 247, 255, 0.1);
      color: #a0e7ff;
      font-family: 'Courier New', monospace;
      min-width: 240px;
      border-radius: 8px;
      z-index: 100;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .window:hover {
      box-shadow: 0 0 30px #00f7ff88, inset 0 0 15px #00f7ff33;
    }

    .window-header {
      background: #0a1a2b;
      padding: 8px 12px;
      border-bottom: 1px solid #00f7ff;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b0ffff;
      text-shadow: 0 0 8px cyan;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .window-btn {
      background: none;
      border: 1px solid #00f7ff;
      color: #00f7ff;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.1s;
    }

    .window-btn:hover {
      background: #00f7ff33;
      box-shadow: 0 0 10px cyan;
    }

    .window-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button, select, input {
      background: #0b1a24;
      border: 1px solid #00ccff;
      color: #b0f0ff;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.1s;
      box-shadow: inset 0 0 5px #00000055;
    }

    button:hover {
      background: #1a3a4a;
      border-color: #88ffff;
      box-shadow: 0 0 12px #00ffff88;
    }

    input[type="range"] {
      padding: 0;
      background: transparent;
      box-shadow: none;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
    }

    .badge {
      color: #ffaa00;
      text-shadow: 0 0 5px orange;
    }

    .log-line {
      font-size: 12px;
      border-bottom: 1px dashed #2a4a5a;
      padding-bottom: 4px;
      color: #9cc;
    }

    #loss-display {
      font-size: 18px;
      font-weight: bold;
      color: #ffd966;
      text-shadow: 0 0 10px #ffaa00;
    }

    /* Plaque */
    #plaque {
      position: fixed;
      bottom: 12px;
      right: 20px;
      color: #6a8a9a;
      font-size: 12px;
      text-align: right;
      z-index: 200;
      text-shadow: 0 0 5px black;
      background: #03080c88;
      padding: 6px 12px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      border: 1px solid #2a5a6a;
      pointer-events: none;
    }

    #status-bar {
      position: fixed;
      bottom: 12px;
      left: 20px;
      color: #7fb;
      font-size: 13px;
      z-index: 200;
      background: #03080caa;
      padding: 4px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid #3a8a9a;
      pointer-events: none;
    }

    .neon-text {
      color: #0ff;
    }
  </style>
</head>
<body class="crt">
<div id="canvas-container">
  <canvas id="neuralCanvas"></canvas>
</div>

<!-- CONTROL PANEL WINDOW (draggable) -->
<div id="control-window" class="window" style="top: 30px; left: 30px;">
  <div class="window-header" id="window-header">
    <span>🧠 NEURAL_OPERATOR.SYS</span>
    <div class="window-controls">
      <div class="window-btn" id="minimize-btn">–</div>
      <div class="window-btn" id="close-btn">✕</div>
    </div>
  </div>
  <div class="window-content" id="window-content">
    <div style="display: flex; gap: 8px; align-items: center;">
      <span style="flex:1;">DATASET:</span>
      <select id="dataset-select" style="flex:2;">
        <option value="xor">XOR (binary)</option>
        <option value="spiral" selected>🌀 SPIRAL (2D)</option>
      </select>
    </div>
    <div>
      <div class="slider-label"><span>HIDDEN NEURONS</span><span id="hidden-count">8</span></div>
      <input type="range" id="hidden-slider" min="2" max="20" value="8" step="1" style="width:100%">
    </div>
    <div>
      <div class="slider-label"><span>LEARNING RATE</span><span id="lr-value">0.15</span></div>
      <input type="range" id="lr-slider" min="0.01" max="0.8" value="0.15" step="0.01" style="width:100%">
    </div>
    <div>
      <div class="slider-label"><span>EPOCHS PER FRAME</span><span id="epochs-per-frame">1</span></div>
      <input type="range" id="epochs-slider" min="1" max="10" value="1" step="1" style="width:100%">
    </div>
    <div style="display: flex; gap: 8px;">
      <button id="reset-btn" style="flex:1;">⟲ RESET</button>
      <button id="train-toggle" style="flex:2; background: #0a3a4a;">⏸️ PAUSE</button>
    </div>
    <div class="log-line">
      <span>LOSS: <span id="loss-display">0.000</span></span>
      <span style="float:right;">ITER: <span id="iter-display">0</span></span>
    </div>
    <div style="font-size:11px; color:#6ab; margin-top:4px;">
      <span>🔴 = negative weight &nbsp;|&nbsp; 🔵 = positive weight</span><br>
      <span>💡 brightness = activation</span>
    </div>
    <hr style="border-color:#1a4a5a; margin:4px 0;">
    <button id="add-noise-btn" style="background:#1a2a3a;">🎲 ADD TRAINING NOISE</button>
  </div>
</div>

<!-- PLAQUE & STATUS -->
<div id="plaque">CONSCIOUSNODE SOFTWORKS<br>« everything I made, nothing lost »</div>
<div id="status-bar">NEURON CATHEDRAL v1.0 &nbsp;|&nbsp; <span id="train-status">● TRAINING</span></div>

<script>
  (function(){
    "use strict";

    // ---------- CANVAS & GLOBALS ----------
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    
    // Network configuration
    let inputSize = 2;
    let hiddenSize = 8;
    let outputSize = 1;  // regression or binary classification
    
    // We'll store weights and biases as plain arrays for clarity
    let W1, b1, W2, b2;  // hidden layer, output layer
    
    // Activation function: leaky ReLU for hidden, sigmoid for output (binary classification)
    // For spiral we'll use sigmoid output, treat >0.5 as class 1.
    
    // Training state
    let training = true;
    let epoch = 0;
    let lossHistory = [];
    let currentLoss = 0.0;
    
    // Dataset
    let datasetType = 'spiral'; // 'xor' or 'spiral'
    let X_train = [], y_train = [];
    const N_SAMPLES = 400;
    
    // Visualization pan/zoom (simple, not used heavily)
    let viewOffsetX = 0, viewOffsetY = 0;
    
    // UI elements
    const hiddenSlider = document.getElementById('hidden-slider');
    const hiddenSpan = document.getElementById('hidden-count');
    const lrSlider = document.getElementById('lr-slider');
    const lrSpan = document.getElementById('lr-value');
    const epochsSlider = document.getElementById('epochs-slider');
    const epochsSpan = document.getElementById('epochs-per-frame');
    const datasetSelect = document.getElementById('dataset-select');
    const resetBtn = document.getElementById('reset-btn');
    const trainToggle = document.getElementById('train-toggle');
    const lossDisplay = document.getElementById('loss-display');
    const iterDisplay = document.getElementById('iter-display');
    const trainStatus = document.getElementById('train-status');
    const addNoiseBtn = document.getElementById('add-noise-btn');
    
    // Dragging windows
    const win = document.getElementById('control-window');
    const header = document.getElementById('window-header');
    let isDragging = false;
    let dragOffsetX, dragOffsetY;
    
    // ---------- INITIALIZE NETWORK ----------
    function initializeWeights() {
      // Xavier-ish init
      const scale1 = Math.sqrt(2.0 / inputSize);
      W1 = new Array(hiddenSize * inputSize);
      for (let i=0; i<W1.length; i++) W1[i] = (Math.random() * 2 - 1) * scale1;
      
      b1 = new Array(hiddenSize);
      for (let i=0; i<hiddenSize; i++) b1[i] = 0.0;
      
      const scale2 = Math.sqrt(2.0 / hiddenSize);
      W2 = new Array(outputSize * hiddenSize);
      for (let i=0; i<W2.length; i++) W2[i] = (Math.random() * 2 - 1) * scale2;
      
      b2 = new Array(outputSize);
      for (let i=0; i<outputSize; i++) b2[i] = 0.0;
    }
    
    // Forward pass (returns activations for all layers for visualization)
    function forward(x) {
      // x: array of length inputSize
      // hidden layer
      let h = new Array(hiddenSize);
      for (let i=0; i<hiddenSize; i++) {
        let sum = b1[i];
        for (let j=0; j<inputSize; j++) {
          sum += W1[i * inputSize + j] * x[j];
        }
        h[i] = leakyRelu(sum);
      }
      // output layer
      let out = new Array(outputSize);
      for (let i=0; i<outputSize; i++) {
        let sum = b2[i];
        for (let j=0; j<hiddenSize; j++) {
          sum += W2[i * hiddenSize + j] * h[j];
        }
        out[i] = sigmoid(sum);
      }
      return { h, out };
    }
    
    function leakyRelu(x) {
      return x > 0 ? x : 0.01 * x;
    }
    
    function leakyReluDeriv(x) {
      return x > 0 ? 1 : 0.01;
    }
    
    function sigmoid(x) {
      return 1 / (1 + Math.exp(-x));
    }
    
    // Train a single sample with backprop (SGD)
    function trainSample(x, yTrue, lr) {
      // Forward
      let h = new Array(hiddenSize);
      let hPreAct = new Array(hiddenSize);
      for (let i=0; i<hiddenSize; i++) {
        let sum = b1[i];
        for (let j=0; j<inputSize; j++) sum += W1[i * inputSize + j] * x[j];
        hPreAct[i] = sum;
        h[i] = leakyRelu(sum);
      }
      
      let outPreAct = new Array(outputSize);
      let out = new Array(outputSize);
      for (let i=0; i<outputSize; i++) {
        let sum = b2[i];
        for (let j=0; j<hiddenSize; j++) sum += W2[i * hiddenSize + j] * h[j];
        outPreAct[i] = sum;
        out[i] = sigmoid(sum);
      }
      
      // Loss derivative (MSE derivative for sigmoid output)
      let dOut = new Array(outputSize);
      for (let i=0; i<outputSize; i++) {
        dOut[i] = (out[i] - yTrue[i]) * out[i] * (1 - out[i]); // derivative of MSE wrt pre-activation
      }
      
      // Gradients for W2, b2
      let dW2 = new Array(outputSize * hiddenSize);
      let db2 = new Array(outputSize);
      for (let i=0; i<outputSize; i++) {
        db2[i] = dOut[i];
        for (let j=0; j<hiddenSize; j++) {
          dW2[i * hiddenSize + j] = dOut[i] * h[j];
        }
      }
      
      // Backprop to hidden layer
      let dHidden = new Array(hiddenSize);
      for (let j=0; j<hiddenSize; j++) {
        let sum = 0;
        for (let i=0; i<outputSize; i++) {
          sum += W2[i * hiddenSize + j] * dOut[i];
        }
        dHidden[j] = sum * leakyReluDeriv(hPreAct[j]);
      }
      
      let dW1 = new Array(hiddenSize * inputSize);
      let db1 = new Array(hiddenSize);
      for (let i=0; i<hiddenSize; i++) {
        db1[i] = dHidden[i];
        for (let j=0; j<inputSize; j++) {
          dW1[i * inputSize + j] = dHidden[i] * x[j];
        }
      }
      
      // Apply updates
      for (let i=0; i<W1.length; i++) W1[i] -= lr * dW1[i];
      for (let i=0; i<b1.length; i++) b1[i] -= lr * db1[i];
      for (let i=0; i<W2.length; i++) W2[i] -= lr * dW2[i];
      for (let i=0; i<b2.length; i++) b2[i] -= lr * db2[i];
      
      // Compute loss for monitoring
      let loss = 0;
      for (let i=0; i<outputSize; i++) {
        let diff = out[i] - yTrue[i];
        loss += diff * diff;
      }
      return loss;
    }
    
    // Batch training over dataset
    function trainEpoch(lr) {
      let totalLoss = 0;
      // Shuffle
      const indices = [...Array(X_train.length).keys()];
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      for (let idx of indices) {
        totalLoss += trainSample(X_train[idx], y_train[idx], lr);
      }
      return totalLoss / X_train.length;
    }
    
    // ---------- DATASET GENERATION ----------
    function generateDataset(type) {
      if (type === 'xor') {
        X_train = [];
        y_train = [];
        const points = [[0,0],[0,1],[1,0],[1,1]];
        for (let p of points) {
          for (let k=0; k<100; k++) {
            let x1 = p[0] + (Math.random()-0.5)*0.2;
            let x2 = p[1] + (Math.random()-0.5)*0.2;
            X_train.push([x1, x2]);
            let target = (p[0] ^ p[1]) ? 1 : 0;
            y_train.push([target]);
          }
        }
      } else { // spiral
        X_train = [];
        y_train = [];
        const n = N_SAMPLES / 2;
        for (let i=0; i<n; i++) {
          let r = (i / n) * 4.5;
          let t = (i / n) * 3.5 * Math.PI + 0.5;
          let x1 = r * Math.sin(t) + (Math.random()-0.5)*0.15;
          let x2 = r * Math.cos(t) + (Math.random()-0.5)*0.15;
          X_train.push([x1, x2]);
          y_train.push([0]);
          
          let r2 = (i / n) * 4.5;
          let t2 = (i / n) * 3.5 * Math.PI + 0.5 + Math.PI;
          let x1b = r2 * Math.sin(t2) + (Math.random()-0.5)*0.15;
          let x2b = r2 * Math.cos(t2) + (Math.random()-0.5)*0.15;
          X_train.push([x1b, x2b]);
          y_train.push([1]);
        }
      }
    }
    
    // Reinitialize network on reset or hidden change
    function resetNetwork() {
      hiddenSize = parseInt(hiddenSlider.value);
      initializeWeights();
      epoch = 0;
      lossHistory = [];
      currentLoss = 0;
      updateUI();
    }
    
    // Update UI sliders etc
    function updateUI() {
      hiddenSpan.textContent = hiddenSize;
      lrSpan.textContent = parseFloat(lrSlider.value).toFixed(3);
      epochsSpan.textContent = epochsSlider.value;
      iterDisplay.textContent = epoch;
    }
    
    // Draw everything
    function draw() {
      const w = canvas.width = window.innerWidth;
      const h = canvas.height = window.innerHeight;
      
      ctx.clearRect(0, 0, w, h);
      
      // Draw dataset points faintly in background
      ctx.save();
      ctx.translate(w/2, h/2);
      const scale = Math.min(w, h) * 0.09; // scale to fit
      
      // Draw points
      for (let i=0; i<X_train.length; i+=2) { // decimate for perf
        let px = X_train[i][0] * scale;
        let py = -X_train[i][1] * scale; // flip y
        let target = y_train[i][0];
        ctx.fillStyle = target > 0.5 ? '#ff66aa' : '#66ccff';
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, 2*Math.PI);
        ctx.fill();
        ctx.shadowColor = target > 0.5 ? '#ff00aa' : '#00aaff';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      
      // Compute network activations for a grid to show decision boundary? Not necessary, we'll draw network structure
      
      // Draw neural network architecture as nodes and edges
      // Positions: input layer left, hidden middle, output right
      const layerPositions = [
        { x: -scale * 2.0, neurons: inputSize },
        { x: 0, neurons: hiddenSize },
        { x: scale * 2.0, neurons: outputSize }
      ];
      
      const neuronRadius = 14;
      const verticalSpacing = 30;
      
      // Get activations for a sample? We'll use a dummy sample to show activations live
      // For better effect, we can use the mean of dataset or just zeros
      let sampleX = [0,0];
      if (X_train.length > 0) sampleX = X_train[epoch % X_train.length];
      const acts = forward(sampleX);
      const hiddenActs = acts.h;
      const outputActs = acts.out;
      
      // Draw connections first (weights)
      // Input -> Hidden
      for (let i=0; i<inputSize; i++) {
        let x1 = layerPositions[0].x;
        let y1 = (i - (inputSize-1)/2) * verticalSpacing;
        for (let j=0; j<hiddenSize; j++) {
          let x2 = layerPositions[1].x;
          let y2 = (j - (hiddenSize-1)/2) * verticalSpacing;
          let weight = W1[j * inputSize + i];
          let alpha = Math.min(Math.abs(weight) * 1.5, 0.9);
          let color = weight > 0 ? `rgba(50, 150, 255, ${alpha})` : `rgba(255, 70, 70, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(1, Math.abs(weight) * 2.5);
          ctx.stroke();
        }
      }
      // Hidden -> Output
      for (let j=0; j<hiddenSize; j++) {
        let x1 = layerPositions[1].x;
        let y1 = (j - (hiddenSize-1)/2) * verticalSpacing;
        for (let k=0; k<outputSize; k++) {
          let x2 = layerPositions[2].x;
          let y2 = (k - (outputSize-1)/2) * verticalSpacing;
          let weight = W2[k * hiddenSize + j];
          let alpha = Math.min(Math.abs(weight) * 1.5, 0.9);
          let color = weight > 0 ? `rgba(50, 150, 255, ${alpha})` : `rgba(255, 70, 70, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(1, Math.abs(weight) * 2.5);
          ctx.stroke();
        }
      }
      
      // Draw neurons
      // Input layer (use sampleX for brightness)
      for (let i=0; i<inputSize; i++) {
        let x = layerPositions[0].x;
        let y = (i - (inputSize-1)/2) * verticalSpacing;
        let val = sampleX[i];
        // normalize val roughly
        let bright = Math.min(1, Math.abs(val)*0.5 + 0.3);
        ctx.fillStyle = `rgba(180, 220, 255, ${bright})`;
        ctx.shadowColor = '#0cf';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(x, y, neuronRadius, 0, 2*Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#aaf';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // Hidden
      for (let j=0; j<hiddenSize; j++) {
        let x = layerPositions[1].x;
        let y = (j - (hiddenSize-1)/2) * verticalSpacing;
        let act = hiddenActs[j];
        let bright = Math.min(1, act * 1.2);
        ctx.fillStyle = `rgba(255, 220, 140, ${bright})`;
        ctx.shadowColor = '#fc0';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(x, y, neuronRadius, 0, 2*Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#fd9';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
      // Output
      for (let k=0; k<outputSize; k++) {
        let x = layerPositions[2].x;
        let y = (k - (outputSize-1)/2) * verticalSpacing;
        let act = outputActs[k];
        let bright = Math.min(1, act * 1.2);
        ctx.fillStyle = `rgba(150, 255, 180, ${bright})`;
        ctx.shadowColor = '#6f6';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(x, y, neuronRadius, 0, 2*Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#8f8';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
      
      // Draw loss curve small
      ctx.save();
      ctx.translate(20, h-80);
      ctx.fillStyle = '#0a1a2aaa';
      ctx.fillRect(0,0,180,60);
      ctx.strokeStyle = '#0cf';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const maxLoss = Math.max(0.5, ...lossHistory.slice(-50));
      for (let i=0; i<lossHistory.length && i<180; i++) {
        let x = i;
        let y = 60 - (lossHistory[i] / maxLoss) * 50;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.fillStyle = '#bdf';
      ctx.font = '10px monospace';
      ctx.fillText('LOSS HISTORY', 5, 15);
      ctx.restore();
    }
    
    // Animation loop
    function animate() {
      if (training) {
        const lr = parseFloat(lrSlider.value);
        const epochsPerFrame = parseInt(epochsSlider.value);
        let avgLoss = 0;
        for (let e=0; e<epochsPerFrame; e++) {
          avgLoss += trainEpoch(lr);
          epoch++;
        }
        currentLoss = avgLoss / epochsPerFrame;
        lossHistory.push(currentLoss);
        if (lossHistory.length > 200) lossHistory.shift();
        
        lossDisplay.textContent = currentLoss.toFixed(4);
        iterDisplay.textContent = epoch;
        trainStatus.innerHTML = '● TRAINING';
        trainStatus.style.color = '#0f0';
      } else {
        trainStatus.innerHTML = '⏸️ PAUSED';
        trainStatus.style.color = '#fa0';
      }
      
      draw();
      requestAnimationFrame(animate);
    }
    
    // ---------- EVENT LISTENERS ----------
    hiddenSlider.addEventListener('input', () => {
      hiddenSize = parseInt(hiddenSlider.value);
      hiddenSpan.textContent = hiddenSize;
      resetNetwork();
    });
    
    lrSlider.addEventListener('input', () => {
      lrSpan.textContent = parseFloat(lrSlider.value).toFixed(3);
    });
    
    epochsSlider.addEventListener('input', () => {
      epochsSpan.textContent = epochsSlider.value;
    });
    
    datasetSelect.addEventListener('change', (e) => {
      datasetType = e.target.value;
      generateDataset(datasetType);
      resetNetwork();
    });
    
    resetBtn.addEventListener('click', () => {
      generateDataset(datasetType);
      resetNetwork();
    });
    
    trainToggle.addEventListener('click', () => {
      training = !training;
      trainToggle.textContent = training ? '⏸️ PAUSE' : '▶️ TRAIN';
    });
    
    addNoiseBtn.addEventListener('click', () => {
      // Add noise to weights (like a small mutation)
      for (let i=0; i<W1.length; i++) W1[i] += (Math.random()-0.5)*0.03;
      for (let i=0; i<W2.length; i++) W2[i] += (Math.random()-0.5)*0.03;
    });
    
    // Window dragging
    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      const rect = win.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      win.style.cursor = 'grabbing';
    });
    
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      let x = e.clientX - dragOffsetX;
      let y = e.clientY - dragOffsetY;
      x = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, x));
      y = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, y));
      win.style.left = x + 'px';
      win.style.top = y + 'px';
    });
    
    window.addEventListener('mouseup', () => {
      isDragging = false;
      win.style.cursor = '';
    });
    
    document.getElementById('minimize-btn').addEventListener('click', () => {
      const content = document.getElementById('window-content');
      if (content.style.display === 'none') {
        content.style.display = 'flex';
      } else {
        content.style.display = 'none';
      }
    });
    
    document.getElementById('close-btn').addEventListener('click', () => {
      win.style.display = 'none';
      // Provide a way to bring back? Let's add a hidden click on plaque to revive.
    });
    
    // Double-click plaque to revive window
    document.getElementById('plaque').addEventListener('dblclick', () => {
      win.style.display = 'block';
    });
    
    // Resize canvas on window resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    });
    
    // ---------- START ----------
    generateDataset('spiral');
    resetNetwork();
    // initial draw
    draw();
    requestAnimationFrame(animate);
  })();
</script>
</body>
</html>
