<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsciousNode SoftWorks | Xinu: Genesis</title>
    <style>
        :root {
            --bg: #050505;
            --fg: #e0e0e0;
            --accent: #ff3366;
            --grid: #1a1a1a;
            --ui: #222;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        button:hover {
            background-color: var(--accent);
            color: var(--bg);
        }
        #world-canvas {
            background-color: var(--grid);
            border: 1px solid #333;
            image-rendering: pixelated;
        }
        #log {
            width: 100%;
            max-width: 800px;
            height: 150px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
            border: 1px dashed #333;
            padding: 10px;
        }
        .log-entry { margin-bottom: 5px; }
        .highlight { color: var(--accent); font-weight: bold; }
        .sys-msg { color: #00ffcc; }
    </style>
</head>
<body>

    <header>
        <div>SYSTEM: XINU_GENESIS</div>
        <button id="bind-btn">[ BIND CHRONICLE ]</button>
        <div>EPOCH: <span id="epoch-counter">0</span></div>
    </header>

    <canvas id="world-canvas" width="800" height="400"></canvas>
    
    <div id="log"></div>

<script>
/**
 * CONSCIOUSNODE SOFTWORKS
 * Xinu: Genesis v0.2 - The Persistence Update
 * Zero dependencies. Offline first.
 */

const canvas = document.getElementById('world-canvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const epochEl = document.getElementById('epoch-counter');
const bindBtn = document.getElementById('bind-btn');

const GRID_SIZE = 10;
const COLS = canvas.width / GRID_SIZE;
const ROWS = canvas.height / GRID_SIZE;

let epoch = 0;
let isRunning = false;
let fileHandle = null;

// Neural Agent Engine
class NeuralAgent {
    constructor(name, symbol, color, x, y, state = null) {
        this.name = name;
        this.symbol = symbol;
        this.color = color;
        this.x = x;
        this.y = y;
        this.state = state || [Math.random(), Math.random(), 0.0, Math.random()];
    }

    tick() {
        this.state[0] += 0.05; // Hunger
        this.state[2] += 0.02; // Fatigue
        let actionForce = Math.tanh(this.state[1] * 2.0 - this.state[2]); 
        
        if (this.state[3] > 0.8 || actionForce > 0.5) {
            this.moveRandomly();
            this.state[3] = Math.random(); 
            this.state[1] = Math.random(); 
            return `${this.name} migrated to sector [${this.x},${this.y}].`;
        }
        if (this.state[0] > 0.8) {
            this.state[0] = 0.0; 
            return `${this.name} scavenged for resources.`;
        }
        return null;
    }

    moveRandomly() {
        const dirs = [[0,-1], [1,0], [0,1], [-1,0]];
        const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
        this.x = Math.max(0, Math.min(COLS - 1, this.x + dx));
        this.y = Math.max(0, Math.min(ROWS - 1, this.y + dy));
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.font = "10px Courier";
        ctx.fillText(this.symbol, this.x * GRID_SIZE, this.y * GRID_SIZE + GRID_SIZE);
    }
}

let entities = [];

function logEvent(msg, type = 'normal') {
    const div = document.createElement('div');
    div.className = 'log-entry';
    if (type === 'sys') {
        div.innerHTML = `> [SYS] <span class="sys-msg">${msg}</span>`;
    } else {
        div.innerHTML = `> [T+${epoch}] <span class="highlight">${msg}</span>`;
    }
    logEl.prepend(div);
}

function renderEnvironment() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(34, 34, 34, 0.5)";
    for(let i=0; i<COLS; i++) {
        for(let j=0; j<ROWS; j++) {
            ctx.fillRect(i*GRID_SIZE + 4, j*GRID_SIZE + 4, 2, 2);
        }
    }
}

// === THE FILE SYSTEM ACCESS MAGIK ===

async function bindChronicle() {
    try {
        // Ask user to pick a file to read/write
        [fileHandle] = await window.showOpenFilePicker({
            types: [{ description: 'JSON File', accept: {'application/json': ['.json']} }],
            create: true // Allow creating a new file if it doesn't exist (in some browsers, you might need showSaveFilePicker for pure creation)
        });
        
        bindBtn.innerText = "[ CHRONICLE BOUND ]";
        bindBtn.style.color = "#00ffcc";
        bindBtn.style.borderColor = "#00ffcc";

        // Attempt to read existing data
        const file = await fileHandle.getFile();
        const text = await file.text();
        
        if (text) {
            const data = JSON.parse(text);
            epoch = data.epoch;
            entities = data.entities.map(e => new NeuralAgent(e.name, e.symbol, e.color, e.x, e.y, e.state));
            logEvent("Prior timeline resurrected from physical disk.", "sys");
        } else {
            // New world
            entities = [
                new NeuralAgent("Mara", "d", "#ff9900", Math.floor(COLS/2), Math.floor(ROWS/2)),
                new NeuralAgent("Squeak", "b", "#33ccff", Math.floor(COLS/3), Math.floor(ROWS/3))
            ];
            logEvent("New Genesis initialized. World is empty.", "sys");
        }
        
        if (!isRunning) {
            isRunning = true;
            requestAnimationFrame(loop);
        }

    } catch (err) {
        logEvent("Chronicle binding aborted or failed.", "sys");
        console.error(err);
    }
}

async function writeChronicle() {
    if (!fileHandle) return;
    try {
        const writable = await fileHandle.createWritable();
        const state = {
            epoch: epoch,
            entities: entities
        };
        await writable.write(JSON.stringify(state));
        await writable.close();
        logEvent("World state committed to physical disk.", "sys");
    } catch (err) {
        console.error("Failed to write to chronicle", err);
    }
}

bindBtn.addEventListener('click', async () => {
    // If we want to allow creating easily, we use SaveFilePicker as a fallback if Open fails, 
    // but modern browsers handle it via OpenFilePicker or SaveFilePicker cleanly.
    try {
        fileHandle = await window.showSaveFilePicker({
            suggestedName: 'xinu_world_state.json',
            types: [{ description: 'JSON World State', accept: {'application/json': ['.json']} }]
        });
        
        bindBtn.innerText = "[ SYNC ACTIVE ]";
        bindBtn.style.color = "#00ffcc";
        bindBtn.style.borderColor = "#00ffcc";
        
        // Read if it has data
        const file = await fileHandle.getFile();
        const text = await file.text();
        if (text) {
            const data = JSON.parse(text);
            epoch = data.epoch;
            entities = data.entities.map(e => new NeuralAgent(e.name, e.symbol, e.color, e.x, e.y, e.state));
            logEvent("Timeline Resurrected.", "sys");
        } else {
             entities = [
                new NeuralAgent("Alpha", "A", "#ff3366", Math.floor(COLS/2), Math.floor(ROWS/2)),
                new NeuralAgent("Beta", "B", "#33ccff", Math.floor(COLS/3), Math.floor(ROWS/3))
            ];
            logEvent("New civilization seeded.", "sys");
        }

        if (!isRunning) {
            isRunning = true;
            requestAnimationFrame(loop);
        }
    } catch (err) {
         logEvent("Binding cancelled by user.", "sys");
    }
});

function loop() {
    epoch++;
    epochEl.innerText = epoch;
    renderEnvironment();

    entities.forEach(entity => {
        const actionLog = entity.tick();
        if (actionLog) logEvent(actionLog);
        entity.draw();
    });

    // Auto-save every 100 epochs
    if (epoch % 100 === 0) {
        writeChronicle();
    }

    setTimeout(() => requestAnimationFrame(loop), 250);
}

logEvent("SYSTEM INITIALIZED. Awaiting Chronicle Binding to commence time...", "sys");

</script>
</body>
</html>
